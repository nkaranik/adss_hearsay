system:
  name: "ADSS-Hearsay"
  version: "1.0.0"
  log_level: "INFO"
  artifact_dir: "artifacts"
  seed: 42

# ── Backend selection ─────────────────────────────────────────────────────────
# "gemini"    → Google Gemini API  (needs GEMINI_API_KEY)
# "lmstudio"  → Local LM Studio   (needs LM Studio running on localhost)
backend: "gemini"

gemini:
  model: "gemini-2.5-flash"
  max_tokens: 4096
  temperature: 0.0

lmstudio:
  base_url:    "http://127.0.0.1:1234/v1"
  model:       "qwen/qwen3.6-35b-a3b"   # must match model loaded in LM Studio
  max_tokens:  260000    # for 262144 context: 262144 - 700 (prompt) - 1444 (buffer)
  temperature: 0.0
  disable_thinking: true   # appends /no_think for Qwen3 reasoning models

dataset:
  source: "huggingface"
  hf_repo: "nguha/legalbench"
  hf_config: "hearsay"
  train_split: "train"
  test_split: "test"
  max_samples: null
  local_cache: "data/hearsay_cache.json"

mining:
  max_arguments: 6          # fewer args = faster + fewer tokens
  min_confidence: 0.3
  include_neutral_relations: false
  max_retries: 2

scoring:
  strength_min: 0.1
  strength_max: 1.0

qbaf:
  solver: "df_quad"
  max_iterations: 50
  convergence_eps: 1.0e-6
  decision_threshold: 0.5
  uncertainty_band: [0.45, 0.55]
  phi_initial_strength: 0.5

evaluation:
  bootstrap_samples: 1000
  confidence_level: 0.95
  output_dir: "artifacts/evaluation"

baselines:
  few_shot_examples: 3
