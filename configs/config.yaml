system:
  name: "ADSS-Hearsay"
  version: "1.0.0"
  log_level: "INFO"
  artifact_dir: "artifacts/contract_nli_predictions"
  seed: 42

backend: "gemini"

gemini:
  model: "gemini-2.5-flash"
  max_tokens: 8192
  temperature: 0.0

lmstudio:
  base_url: "http://127.0.0.1:1234/v1"
  model: "qwen/qwen3.6-35b-a3b"
  max_tokens: 12000
  temperature: 0.0
  disable_thinking: true

# Backward-compatible default dataset block.
# Existing code that expects cfg["dataset"] will still work.
dataset:
  source: "huggingface"
  hf_repo: "nguha/legalbench"
  hf_config: "hearsay"
  train_split: "train"
  test_split: "test"
  max_samples: null
  local_cache: "data/hearsay_cache.json"

# New multi-benchmark configuration used by scripts/run_evaluation_suite.py.
datasets:
  hearsay:
    source: "huggingface"
    hf_repo: "nguha/legalbench"
    hf_config: "hearsay"
    train_split: "train"
    test_split: "test"
    max_samples: null
    local_cache: "data/hearsay_cache.json"
    decision_problem: "Is the statement described in this narrative hearsay under FRE 801(c)?"

  contract_nli:
    source: "huggingface"
    hf_repo: "nguha/legalbench"
    hf_config: "contract_nli_confidentiality_of_agreement"
    train_split: "train"
    test_split: "test"
    max_samples: null
    local_cache: "data/contract_nli_confidentiality_cache.json"
    decision_problem: "Does the CONTRACT CONTEXT logically entail the EXACT TARGET STATEMENT, with every material element matched and no missing limitation, exception, party-scope mismatch, information-type mismatch, purpose limitation, recipient-scope mismatch, or disclosure carve-out?"

mining:
  max_arguments: 20
  min_confidence: 0.3
  include_neutral_relations: true
  max_retries: 2

scoring:
  strength_min: 0.1
  strength_max: 1.0

qbaf:
  solver: "df_quad"
  max_iterations: 50
  convergence_eps: 1.0e-6
  decision_threshold: 0.5
  uncertainty_band: [0.45, 0.55]
  phi_initial_strength: 0.5

evaluation:
  bootstrap_samples: 1000
  confidence_level: 0.95
  output_dir: "artifacts/evaluation_suite"

baselines:
  few_shot_examples: 3
